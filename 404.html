<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Device-Master</title>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // https://github.com/rafgraph/spa-github-pages
    // This script takes the current URL and converts the path and query
    // into just a query string, and redirects the browser to the index.html
    // page, where the single page app can handle the routing.
    var pathSegmentsToKeep = 1;

    var l = window.location;
    var repoPath = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
    var remainingPath = l.pathname.slice(repoPath.length).replace(/^\//, '');
    
    var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + repoPath + '/?p=/' + remainingPath + (l.search ? '&' + l.search.slice(1) : '') + l.hash;
    
    window.location.replace(redirectUrl);
  </script>
</head>
<body>
</body>
</html>
